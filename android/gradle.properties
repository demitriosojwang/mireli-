org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# The package id is the app's permanent identity. It must not change once the
# app is published — Google Play treats a new applicationId as a NEW app, losing
# the install base, reviews and ratings. Confirm the domain and brand ownership
# BEFORE the first release; `co.ke.mireli.driver` is a placeholder pending that.
# See docs/03-release-readiness.md.
android.defaults.buildfeatures.buildconfig=true

kotlin.code.style=official